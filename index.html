<!doctype html>
<html lang="en" class="dark" style="background-color:#1c1917">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1917" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Sous" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!-- Before the app runs, for crawlers, and whenever no screen sets one: React
         puts each screen's title before this one (docs/plans/screen-titles.md). -->
    <title>Sous</title>
    <script>
      (function () {
        var supported = ['en', 'uk', 'ru', 'zh-Hans'];
        var locale = null;
        try {
          locale = localStorage.getItem('cook.locale');
        } catch (e) {}
        if (supported.indexOf(locale) === -1) {
          locale = 'en';
          var browser = String((navigator && navigator.language) || '').toLowerCase();
          var primary = browser.split('-')[0];
          if (primary === 'zh') {
            if (!/-(hant|tw|hk|mo)(-|$)/.test(browser)) {
              locale = 'zh-Hans';
            }
          } else if (supported.indexOf(primary) !== -1) {
            locale = primary;
          }
        }
        document.documentElement.lang = locale;
      })();
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('cook.theme') === 'light') {
            theme = 'light';
          }
        } catch (e) {}
        var bg = theme === 'light' ? '#faf7f2' : '#1c1917';
        var root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        root.style.backgroundColor = bg;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', bg);
        }
        var statusBar = document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]',
        );
        if (statusBar) {
          statusBar.setAttribute('content', theme === 'dark' ? 'black' : 'default');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
