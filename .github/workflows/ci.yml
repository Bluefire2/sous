name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The engines floor. The image job covers the Node version the
          # Dockerfile pins for production.
          node-version: '22.18'
          cache: npm
      - run: npm ci
      # tsc -b && vite build: the PWA and Tailwind build, not only types.
      - run: npm run build
      - run: npm test

  # Builds the production image and boots it with no cloud credentials.
  # Catches what tsc cannot: Node type-stripping and import resolution
  # failures, Dockerfile / .dockerignore mistakes, and runtime deps missing
  # after `npm ci --omit=dev`.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sous:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name sous-ci -p 8080:8080 \
            -e PORT=8080 \
            -e PUBLIC_ORIGIN=http://localhost:8080 \
            -e SESSION_SECRET=ci-smoke-not-a-secret \
            sous:ci
      - name: Smoke test
        run: bash .github/scripts/smoke-server.sh http://localhost:8080
      - name: Container logs
        if: always()
        run: docker logs sous-ci || true

  # Test mode (docs/plans/test-mode.md): the built app against a seeded
  # Firestore emulator, with fake personas signed in by /__test/sign-in. The
  # only CI job that runs the emulator (the scheduled i18n-review.yml is the
  # other workflow); unit tests stay pure. Needs no secrets.
  test-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Start the Firestore emulator
        run: |
          docker run -d --name firestore-emulator -p 127.0.0.1:8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8085
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Wait for the emulator
        run: |
          for _ in $(seq 1 90); do
            if [ "$(curl -s --max-time 2 http://127.0.0.1:8085/ || true)" = "Ok" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "The Firestore emulator never answered"
          exit 1
      - name: Start test mode
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
        run: node testing/test-server.ts --static --port 4173 > test-server.log 2>&1 &
      - name: Smoke test
        run: node testing/smoke.ts http://localhost:4173
      - name: Logs
        if: always()
        run: |
          cat test-server.log || true
          docker logs firestore-emulator 2>&1 | tail -50 || true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
